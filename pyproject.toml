[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcutover"
version = "1.0.0"
description = "Offline abstract service cutover isolation audit and batch planner"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
meshcutover = "meshcutover.cli:main"

[tool.setuptools]
packages = ["meshcutover"]
